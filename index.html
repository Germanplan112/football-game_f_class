<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚽ Футбол 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 100vh;
    max-height: 520px;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  #sky {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, #87ceeb 0%, #b5e0f5 70%, #d8f0ff 100%);
  }

  #stands {
    position: absolute;
    top: 10%; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(180deg, #708090 0%, #4a5568 100%);
    overflow: hidden;
    border-radius: 50% 50% 0 0 / 15% 15% 0 0;
  }

  #crowd {
    position: absolute;
    inset: 8% 4% 0 4%;
    background-image:
      radial-gradient(circle, #e53e3e 2px, transparent 3px),
      radial-gradient(circle, #3182ce 2px, transparent 3px),
      radial-gradient(circle, #38a169 2px, transparent 3px),
      radial-gradient(circle, #d69e2e 2px, transparent 3px),
      radial-gradient(circle, #805ad5 2px, transparent 3px),
      radial-gradient(circle, #dd6b20 2px, transparent 3px);
    background-size: 14px 14px, 18px 18px, 16px 16px, 20px 20px, 15px 15px, 17px 17px;
    background-position: 0 0, 7px 7px, 3px 10px, 12px 4px, 8px 12px, 5px 2px;
    opacity: 0.85;
  }

  #roof {
    position: absolute;
    top: 10%; left: 0; right: 0;
    height: 4%;
    background: linear-gradient(180deg, #cbd5e0 0%, #94a3b8 100%);
    z-index: 2;
  }

  #field {
    position: absolute;
    top: 50%; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #56ab56 0%, #4a9d4a 30%, #3d8a3d 100%);
  }

  #field::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 40px, rgba(0,0,0,0.06) 40px 80px);
  }

  #horizon {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 4px;
    background: #2a6e2a;
    z-index: 3;
  }

  #center-line {
    position: absolute;
    top: 50%; bottom: 12%;
    left: 50%;
    width: 3px;
    background: rgba(255,255,255,0.6);
    transform: translateX(-50%);
    z-index: 4;
  }

  #center-circle {
    position: absolute;
    top: 68%; left: 50%;
    width: 180px; height: 70px;
    border: 3px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
  }

  .goal {
    position: absolute;
    bottom: 8%;
    width: 90px;
    height: 140px;
    z-index: 5;
  }
  #goal-left { left: 15px; }
  #goal-right { right: 15px; }

  .goal-net {
    position: absolute;
    inset: 0;
    border: 5px solid #fff;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,0.5) 8px 9px),
      repeating-linear-gradient(-45deg, transparent 0 8px, rgba(255,255,255,0.5) 8px 9px);
    box-shadow: inset 0 0 20px rgba(255,255,255,0.4), 0 0 25px rgba(255,255,255,0.3);
  }

  .goal::before, .goal::after {
    content: '';
    position: absolute;
    top: 0; bottom: -10px;
    width: 6px;
    background: #fff;
    border-radius: 3px;
  }
  .goal::before { left: 0; }
  .goal::after  { right: 0; }

  .player {
    position: absolute;
    width: 45px;
    height: 90px;
    z-index: 10;
  }

  .player::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    filter: blur(2px);
    z-index: -1;
  }

  .body-wrap {
    position: absolute;
    inset: 0;
    animation: idle 0.6s ease-in-out infinite;
  }
  @keyframes idle {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  .player.running .body-wrap { animation: runBounce 0.25s ease-in-out infinite; }
  @keyframes runBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .head {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #f4c299;
    border: 2px solid #8b5a3c;
    z-index: 3;
  }
  .head::before {
    content: '';
    position: absolute;
    top: -4px; left: 2px; right: 2px;
    height: 12px;
    background: #2a1810;
    border-radius: 50% 60% 20% 20%;
  }
  .head::after {
    content: '';
    position: absolute;
    top: 8px; right: -3px;
    width: 5px; height: 6px;
    background: #f4c299;
    border: 1px solid #8b5a3c;
    border-radius: 50%;
  }

  .eye {
    position: absolute;
    top: 9px; right: 5px;
    width: 3px; height: 3px;
    background: #000;
    border-radius: 50%;
  }

  .torso {
    position: absolute;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 32px;
    border-radius: 8px 8px 4px 4px;
    z-index: 2;
  }

  .arm-back, .arm-front {
    position: absolute;
    top: 24px;
    width: 8px; height: 26px;
    border-radius: 4px;
    transform-origin: top center;
  }
  .arm-back { left: 8px; z-index: 1; animation: armBackIdle 0.6s ease-in-out infinite; }
  .arm-front { right: 8px; z-index: 3; animation: armFrontIdle 0.6s ease-in-out infinite; }

  @keyframes armBackIdle { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(-25deg); } }
  @keyframes armFrontIdle { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(25deg); } }

  .player.running .arm-back  { animation: armBackRun 0.25s ease-in-out infinite; }
  .player.running .arm-front { animation: armFrontRun 0.25s ease-in-out infinite; }

  @keyframes armBackRun { 0%,100% { transform: rotate(-40deg); } 50% { transform: rotate(10deg); } }
  @keyframes armFrontRun { 0%,100% { transform: rotate(40deg); } 50% { transform: rotate(-10deg); } }

  .shorts {
    position: absolute;
    top: 50px; left: 50%;
    transform: translateX(-50%);
    width: 24px; height: 14px;
    border-radius: 4px;
    z-index: 2;
  }

  .leg-back, .leg-front {
    position: absolute;
    top: 62px;
    width: 8px; height: 22px;
    border-radius: 4px;
    transform-origin: top center;
  }
  .leg-back { left: 14px; z-index: 1; animation: legBackIdle 0.6s ease-in-out infinite; }
  .leg-front { right: 14px; z-index: 3; animation: legFrontIdle 0.6s ease-in-out infinite; }

  @keyframes legBackIdle { 0%,100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }
  @keyframes legFrontIdle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

  .player.running .leg-back  { animation: legBackRun 0.25s ease-in-out infinite; }
  .player.running .leg-front { animation: legFrontRun 0.25s ease-in-out infinite; }

  @keyframes legBackRun { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(35deg); } }
  @keyframes legFrontRun { 0%,100% { transform: rotate(35deg); } 50% { transform: rotate(-35deg); } }

  .leg-back::after, .leg-front::after {
    content: '';
    position: absolute;
    bottom: -3px; left: -3px; right: -3px;
    height: 7px;
    background: #1a1a1a;
    border-radius: 3px 6px 4px 3px;
  }

  #p1 .torso, #p1 .arm-back, #p1 .arm-front { background: #2b6cb0; border: 1px solid #1a4a82; }
  #p1 .shorts { background: #fff; border: 1px solid #999; }
  #p1 .leg-back, #p1 .leg-front { background: #f4c299; }

  #p2 .torso, #p2 .arm-back, #p2 .arm-front { background: #c53030; border: 1px solid #8b1a1a; }
  #p2 .shorts { background: #fff; border: 1px solid #999; }
  #p2 .leg-back, #p2 .leg-front { background: #f4c299; }

  .player.facing-right .body-wrap { transform: scaleX(-1); }
  .player.facing-right .eye { left: 5px; right: auto; }

  #ball {
    position: absolute;
    width: 26px; height: 26px;
    z-index: 9;
  }
  #ball::before {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 6px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    filter: blur(2px);
  }
  .ball-ball {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #e0e0e0 60%, #bbb 100%);
    border: 2px solid #222;
    border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    position: relative;
    animation: ballSpin 2s linear infinite;
  }
  @keyframes ballSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ball-ball::before, .ball-ball::after {
    content: '';
    position: absolute;
    background: #222;
    border-radius: 50%;
  }
  .ball-ball::before { width: 8px; height: 8px; top: 5px; left: 8px; }
  .ball-ball::after  { width: 5px; height: 5px; bottom: 4px; left: 6px; }

  #scoreboard-top {
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    background: #2d3748;
    border: 4px solid #4a5568;
    border-radius: 8px;
    padding: 8px 20px;
    z-index: 20;
  }
  #timer {
    color: #ff4444;
    font-family: 'Courier New', monospace;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  #score-bottom {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: #8b5a3c;
    border: 4px solid #fff;
    border-radius: 12px;
    padding: 6px 16px;
    display: flex;
    gap: 15px;
    align-items: center;
    z-index: 20;
  }
  #score-bottom .num {
    color: #ffd700;
    font-family: 'Courier New', monospace;
    font-size: 24px;
    font-weight: bold;
    min-width: 30px;
    text-align: center;
  }
  #score-bottom .dash { color: #fff; font-size: 22px; font-weight: bold; }
  #score-bottom .icon { font-size: 20px; }

  /* КНОПКИ — ВСЕГДА ВИДНЫ */
  #controls-p1, #controls-p2 {
    position: absolute;
    bottom: 15px;
    width: 190px;
    height: 140px;
    z-index: 50;
  }
  #controls-p1 { left: 15px; }
  #controls-p2 { right: 15px; }

  .ctrl-btn {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 3px solid #fff;
    font-size: 22px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    user-select: none;
    transition: transform 0.05s, box-shadow 0.05s;
    z-index: 51;
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5);
    filter: brightness(1.4);
  }
  .btn-blue { background: radial-gradient(circle at 30% 30%, #4a9eff, #1a5fb4); }
  .btn-red  { background: radial-gradient(circle at 30% 30%, #ff6b6b, #b41a1a); }

  .pos-up    { top: 0;    left: 67px; }
  .pos-left  { top: 67px; left: 8px; }
  .pos-down  { top: 67px; left: 67px; }
  .pos-right { top: 67px; left: 126px; }

  #msg {
    position: absolute;
    top: 35%; left: 0; right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #ffd93d;
    text-shadow: 0 0 20px black, 0 0 40px #ffd93d;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 30;
    pointer-events: none;
  }

  #hint {
    position: absolute;
    top: 60px; right: 10px;
    background: rgba(0,0,0,0.6);
    color: #ffd93d;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 30;
    pointer-events: none;
    font-weight: bold;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 20, 10, 0.95);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
    color: white;
    overflow-y: auto;
  }
  #overlay h1 {
    font-size: 28px;
    color: #ffd93d;
    margin-bottom: 18px;
  }
  #overlay p { font-size: 15px; margin-bottom: 10px; color: #e0e0e0; }
  #overlay .mode-btn {
    margin: 6px 0;
    padding: 16px 25px;
    font-size: 17px;
    font-weight: bold;
    font-family: inherit;
    color: white;
    border: 3px solid white;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.5);
    min-width: 280px;
    text-align: left;
  }
  #overlay .mode-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
  #overlay .mode-btn small { display: block; font-size: 12px; opacity: 0.9; margin-top: 3px; font-weight: normal; }
  .mode-bot    { background: linear-gradient(135deg, #a855f7, #7c3aed); }
  .mode-split  { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .mode-online { background: linear-gradient(135deg, #4ade80, #22c55e); }

  #overlay input {
    width: 100%; max-width: 280px;
    padding: 14px;
    font-size: 22px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.15);
    border: 3px solid #4a9eff;
    border-radius: 12px;
    color: white;
    outline: none;
    margin: 8px 0;
    font-family: inherit;
  }

  #overlay .code-box {
    background: #ffd93d;
    color: #1a3d1a;
    font-size: 32px;
    font-weight: bold;
    padding: 15px 25px;
    border-radius: 15px;
    margin: 15px 0;
    letter-spacing: 4px;
    font-family: monospace;
    cursor: pointer;
  }

  #overlay .status {
    font-size: 15px;
    color: #4ade80;
    margin-top: 12px;
    min-height: 20px;
  }
  #overlay .status.error { color: #ff6b6b; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game">
  <div id="sky"></div>
  <div id="roof"></div>
  <div id="stands"><div id="crowd"></div></div>

  <div id="field"></div>
  <div id="horizon"></div>
  <div id="center-line"></div>
  <div id="center-circle"></div>

  <div class="goal" id="goal-left"><div class="goal-net"></div></div>
  <div class="goal" id="goal-right"><div class="goal-net"></div></div>

  <div id="scoreboard-top"><div id="timer">00:00</div></div>
  <div id="hint">WASD / стрелки / кнопки</div>

  <div id="score-bottom">
    <span class="icon">⚽</span>
    <span class="num" id="s1">0</span>
    <span class="dash">-</span>
    <span class="num" id="s2">0</span>
    <span class="icon">⚽</span>
  </div>

  <div id="msg"></div>

  <div class="player" id="p1">
    <div class="body-wrap">
      <div class="arm-back"></div>
      <div class="leg-back"></div>
      <div class="head"><div class="eye"></div></div>
      <div class="torso"></div>
      <div class="shorts"></div>
      <div class="leg-front"></div>
      <div class="arm-front"></div>
    </div>
  </div>

  <div class="player" id="p2">
    <div class="body-wrap">
      <div class="arm-back"></div>
      <div class="leg-back"></div>
      <div class="head"><div class="eye"></div></div>
      <div class="torso"></div>
      <div class="shorts"></div>
      <div class="leg-front"></div>
      <div class="arm-front"></div>
    </div>
  </div>

  <div id="ball"><div class="ball-ball"></div></div>

  <!-- КНОПКИ — ВСЕГДА ВИДНЫ -->
  <div id="controls-p1">
    <button class="ctrl-btn btn-blue pos-up"    data-key="w">▲</button>
    <button class="ctrl-btn btn-blue pos-left"  data-key="a">◀</button>
    <button class="ctrl-btn btn-blue pos-down"  data-key="s">▼</button>
    <button class="ctrl-btn btn-blue pos-right" data-key="d">▶</button>
  </div>

  <div id="controls-p2">
    <button class="ctrl-btn btn-red pos-up"    data-key="ArrowUp">▲</button>
    <button class="ctrl-btn btn-red pos-left"  data-key="ArrowLeft">◀</button>
    <button class="ctrl-btn btn-red pos-down"  data-key="ArrowDown">▼</button>
    <button class="ctrl-btn btn-red pos-right" data-key="ArrowRight">▶</button>
  </div>

  <div id="overlay"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  const game = document.getElementById('game');
  const p1 = document.getElementById('p1');
  const p2 = document.getElementById('p2');
  const ballEl = document.getElementById('ball');
  const s1El = document.getElementById('s1');
  const s2El = document.getElementById('s2');
  const msgEl = document.getElementById('msg');
  const overlay = document.getElementById('overlay');
  const timerEl = document.getElementById('timer');
  const controls1 = document.getElementById('controls-p1');
  const controls2 = document.getElementById('controls-p2');

  let W, H;
  let mode = null;
  let myRole = null;
  let peer = null, conn = null, myPeerId = null;
  let running = false;
  let FL, FR, FT, FB;

  const P1 = { x: 0, y: 0, vx: 0, vy: 0, speed: 4, size: 40 };
  const P2 = { x: 0, y: 0, vx: 0, vy: 0, speed: 4, size: 40 };
  const B  = { x: 0, y: 0, vx: 0, vy: 0, size: 26, fr: 0.985 };

  let s1 = 0, s2 = 0;
  let keys = {};
  let lastT = 0;
  const WIN_SCORE = 3;
  let matchSeconds = 0;
  let matchTimer = null;
  let goalLock = false;

  function resize() {
    W = game.clientWidth;
    H = game.clientHeight;
    FT = H * 0.52;
    FB = H * 0.88;
    FL = 30;
    FR = W - 30;
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== КЛАВИАТУРА =====
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    keys[e.key.toLowerCase()] = true;
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.key.toLowerCase()] = false;
  });

  // ===== КНОПКИ — ЧЕРЕЗ POINTER EVENTS =====
  function bindBtn(btn) {
    const key = btn.dataset.key;
    if (!key) return;

    const press = (e) => {
      e.preventDefault();
      e.stopPropagation();
      keys[key] = true;
      btn.classList.add('pressed');
    };
    const release = (e) => {
      e.preventDefault();
      e.stopPropagation();
      keys[key] = false;
      btn.classList.remove('pressed');
    };

    // Pointer events — работают и с мышью, и с тачем
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);

    // Страховка для старых браузеров
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    // Отключаем контекстное меню при долгом нажатии
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }

  document.querySelectorAll('.ctrl-btn').forEach(bindBtn);

  // ===== МЕНЮ =====
  function showMenu() {
    mode = null;
    running = false;
    if (matchTimer) { clearInterval(matchTimer); matchTimer = null; }
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>⚽ ФУТБОЛ 2D</h1>
      <p>Выбери режим игры:</p>
      <button class="mode-btn mode-bot" onclick="startBotMode()">
        🤖 С БОТОМ
        <small>Играй против компьютера</small>
      </button>
      <button class="mode-btn mode-split" onclick="startSplitMode()">
        👥 ОДИН ЭКРАН
        <small>Двое на одном устройстве</small>
      </button>
      <button class="mode-btn mode-online" onclick="showOnlineMenu()">
        🌐 ПО КОДУ
        <small>Играть с другом по Wi-Fi</small>
      </button>
      <p style="font-size:12px;opacity:0.7;margin-top:20px;">
        ⚽ Забей 3 гола и победи!<br>
        Управление: WASD / стрелки / кнопки на экране.
      </p>
    `;
  }

  function showOnlineMenu() {
    overlay.innerHTML = `
      <h1>🌐 Онлайн-игра</h1>
      <p>Один создаёт комнату, второй вводит код</p>
      <button class="mode-btn mode-online" onclick="createRoom()">🏠 Создать комнату</button>
      <p style="margin: 12px 0; opacity: 0.7;">— или —</p>
      <input type="text" id="codeInput" placeholder="КОД" maxlength="6">
      <button class="mode-btn mode-bot" onclick="joinRoom()">🔗 Подключиться</button>
      <div class="status" id="status"></div>
      <button class="mode-btn" style="background:linear-gradient(135deg,#94a3b8,#64748b);min-width:200px;" onclick="showMenu()">← Назад</button>
    `;
  }

  function startBotMode() {
    mode = 'bot'; myRole = 'host';
    s1 = 0; s2 = 0; s1El.textContent = 0; s2El.textContent = 0;
    goalLock = false;
    overlay.classList.add('hidden');
    controls1.style.display = 'block';
    controls2.style.display = 'none';
    resize(); reset();
    startMatchTimer();
    running = true; lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function startSplitMode() {
    mode = 'split'; myRole = 'host';
    s1 = 0; s2 = 0; s1El.textContent = 0; s2El.textContent = 0;
    goalLock = false;
    overlay.classList.add('hidden');
    controls1.style.display = 'block';
    controls2.style.display = 'block';
    resize(); reset();
    startMatchTimer();
    running = true; lastT = performance.now();
    requestAnimationFrame(loop);
  }

  // ===== ОНЛАЙН =====
  function generateCode() {
    const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = 'FB';
    for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)];
    return c;
  }

  function initPeer(customId = null) {
    const id = customId || ('fb-' + Math.random().toString(36).substring(2, 12));
    peer = new Peer(id, {
      host: '1.peerjs.com',
      port: 443,
      path: '/',
      secure: true,
      debug: 2,
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ]}
    });

    const timeout = setTimeout(() => {
      if (!myPeerId) {
        const st = document.getElementById('status');
        if (st) { st.textContent = '⚠️ Сервер не отвечает. Пробуем снова...'; st.className = 'status error'; }
        try { peer.destroy(); } catch(e) {}
        setTimeout(() => initPeer(customId), 5000);
      }
    }, 15000);

    peer.on('open', id => {
      clearTimeout(timeout);
      myPeerId = id;
      const st = document.getElementById('status');
      if (st) { st.textContent = '✅ Готово!'; st.className = 'status'; }
    });

    peer.on('error', err => {
      clearTimeout(timeout);
      const st = document.getElementById('status');
      if (!st) return;
      if (err.type === 'network') {
        st.textContent = '⚠️ Сервер не отвечает. Ждём...';
        st.className = 'status error';
        setTimeout(() => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch(e) {} }, 5000);
      } else {
        st.textContent = '⚠️ Ошибка: ' + err.type;
        st.className = 'status error';
      }
    });

    peer.on('connection', c => { conn = c; setupConnection(); });
  }

  function createRoom() {
    mode = 'online'; myRole = 'host';
    s1 = 0; s2 = 0; goalLock = false;
    const code = generateCode();
    const st = document.getElementById('status');
    st.textContent = 'Создаём комнату...';
    initPeer(code);
    const w = setInterval(() => {
      if (myPeerId) {
        clearInterval(w);
        overlay.innerHTML = `
          <h1>🏠 Комната создана!</h1>
          <p>Скажи другу этот код:</p>
          <div class="code-box" onclick="copyCode('${code}')">${code}</div>
          <p style="font-size: 12px; opacity: 0.7;">👆 нажми, чтобы скопировать</p>
          <p style="font-size: 13px; opacity: 0.8;">Ждём второго игрока...</p>
          <div class="status">⏳ Ожидание...</div>
          <button class="mode-btn" style="background:linear-gradient(135deg,#94a3b8,#64748b);min-width:200px;" onclick="location.reload()">← Отмена</button>
        `;
      }
    }, 100);
  }

  function joinRoom() {
    mode = 'online'; myRole = 'guest';
    s1 = 0; s2 = 0; goalLock = false;
    let code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length < 4) {
      const st = document.getElementById('status');
      st.textContent = 'Введи код'; st.className = 'status error';
      return;
    }
    if (!code.startsWith('FB')) code = 'FB' + code;
    const st = document.getElementById('status');
    st.textContent = 'Подключаемся...';
    initPeer();
    const w = setInterval(() => {
      if (peer && peer.open) {
        clearInterval(w);
        conn = peer.connect(code, { reliable: true });
        setupConnection();
      }
    }, 100);
  }

  function setupConnection() {
    conn.on('open', () => startOnlineMatch());
    conn.on('data', d => handleData(d));
    conn.on('close', () => {
      running = false;
      msgEl.textContent = '⚠️ Соперник вышел';
      msgEl.style.opacity = 1;
      setTimeout(() => location.reload(), 2500);
    });
  }

  function copyCode(code) {
    navigator.clipboard?.writeText(code);
    const el = document.querySelector('.code-box');
    el.textContent = '✓ Скопировано!';
    setTimeout(() => { el.textContent = code; }, 1000);
  }

  async function startOnlineMatch() {
    overlay.classList.add('hidden');
    controls1.style.display = 'block';
    controls2.style.display = 'none';
    resize(); reset();
    startMatchTimer();
    running = true; lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function startMatchTimer() {
    matchSeconds = 0;
    updateTimer();
    if (matchTimer) clearInterval(matchTimer);
    matchTimer = setInterval(() => {
      matchSeconds++;
      updateTimer();
      if (matchSeconds >= 60) { clearInterval(matchTimer); endMatch(); }
    }, 1000);
  }

  function updateTimer() {
    const t = matchSeconds * 30;
    const m = Math.floor(t / 60);
    const s = t % 60;
    timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function endMatch() {
    running = false;
    goalLock = true;
    let winner = 'НИЧЬЯ!';
    if (s1 > s2) winner = '🔵 СИНИЕ ПОБЕДИЛИ!';
    else if (s2 > s1) winner = '🔴 КРАСНЫЕ ПОБЕДИЛИ!';
    msgEl.textContent = winner;
    msgEl.style.opacity = 1;
    setTimeout(() => location.reload(), 3500);
  }

  function reset() {
    P1.x = W * 0.3; P1.y = (FT + FB) / 2;
    P2.x = W * 0.7; P2.y = (FT + FB) / 2;
    P1.vx = P1.vy = 0; P2.vx = P2.vy = 0;
    B.x = W / 2; B.y = FB - 40;
    B.vx = B.vy = 0;
    goalLock = false;
  }

  function move(P, el, ax, ay, dt) {
    P.vx = ax * P.speed * dt;
    P.vy = ay * P.speed * dt;
    P.x += P.vx;
    P.y += P.vy;
    const r = P.size / 2;
    P.x = Math.max(FL + r, Math.min(FR - r, P.x));
    P.y = Math.max(FT + r, Math.min(FB - r, P.y));

    const moving = Math.abs(P.vx) > 0.1 || Math.abs(P.vy) > 0.1;
    if (moving) el.classList.add('running');
    else el.classList.remove('running');

    if (P.vx > 0.1) el.classList.add('facing-right');
    else if (P.vx < -0.1) el.classList.remove('facing-right');
  }

  function coll(P) {
    const dx = B.x - P.x, dy = B.y - P.y;
    const d = Math.hypot(dx, dy);
    const md = (B.size + P.size) / 2 + 2;
    if (d < md && d > 0) {
      const nx = dx / d, ny = dy / d;
      B.x = P.x + nx * md;
      B.y = P.y + ny * md;
      B.vx = nx * 7 + P.vx * 0.5;
      B.vy = ny * 7 + P.vy * 0.5;
    }
  }

  function goal(side) {
    if (goalLock) return;
    goalLock = true;
    if (side === 'left') { s2++; s2El.textContent = s2; showMsg('🔴 ГОЛ!'); }
    else { s1++; s1El.textContent = s1; showMsg('🔵 ГОЛ!'); }
    if (mode === 'online') sendData({ type: 'goal', side, s1, s2 });
  }

  function showMsg(t) {
    msgEl.textContent = t;
    msgEl.style.opacity = 1;
    B.vx = 0; B.vy = 0;
    setTimeout(() => {
      msgEl.style.opacity = 0;
      if (s1 >= WIN_SCORE || s2 >= WIN_SCORE) endMatch();
      else {
        reset();
        if (mode === 'online' && myRole === 'host') sendData({ type: 'reset', s1, s2 });
      }
    }, 1500);
  }

  function sendData(data) { if (conn && conn.open) conn.send(data); }

  function handleData(data) {
    if (data.type === 'state') {
      if (myRole === 'host') { P2.x = data.p2x; P2.y = data.p2y; }
      else { P1.x = data.p1x; P1.y = data.p1y; }
      B.x = data.bx; B.y = data.by;
      B.vx = data.bvx; B.vy = data.bvy;
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
    } else if (data.type === 'goal') {
      if (goalLock) return;
      goalLock = true;
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
      showMsg(data.side === 'left' ? '🔴 ГОЛ!' : '🔵 ГОЛ!');
    } else if (data.type === 'reset') {
      B.x = W / 2; B.y = FB - 40; B.vx = 0; B.vy = 0;
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
      goalLock = false;
    }
  }

  function sendState() {
    const data = { type: 'state', bx: B.x, by: B.y, bvx: B.vx, bvy: B.vy, s1, s2 };
    if (myRole === 'host') { data.p1x = P1.x; data.p1y = P1.y; }
    else { data.p2x = P2.x; data.p2y = P2.y; }
    sendData(data);
  }

  function updateBot(dt) {
    const targetX = Math.max(W * 0.5, Math.min(FR - 30, B.x + 25));
    const targetY = B.y;
    let ax = 0, ay = 0;
    if (Math.abs(targetX - P2.x) > 5) ax = targetX > P2.x ? 1 : -1;
    if (Math.abs(targetY - P2.y) > 5) ay = targetY > P2.y ? 1 : -1;
    move(P2, p2, ax, ay, dt);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastT) / 16.67) || 1;
    lastT = now;

    if (mode === 'bot') {
      let ax = 0, ay = 0;
      if (keys['w'] || keys['ц'] || keys['W'] || keys['Ц']) ay -= 1;
      if (keys['s'] || keys['ы'] || keys['S'] || keys['Ы']) ay += 1;
      if (keys['a'] || keys['ф'] || keys['A'] || keys['Ф']) ax -= 1;
      if (keys['d'] || keys['в'] || keys['D'] || keys['В']) ax += 1;
      move(P1, p1, ax, ay, dt);
      updateBot(dt);
      physics(dt);
    } else if (mode === 'split') {
      let ax = 0, ay = 0;
      if (keys['w'] || keys['ц'] || keys['W'] || keys['Ц']) ay -= 1;
      if (keys['s'] || keys['ы'] || keys['S'] || keys['Ы']) ay += 1;
      if (keys['a'] || keys['ф'] || keys['A'] || keys['Ф']) ax -= 1;
      if (keys['d'] || keys['в'] || keys['D'] || keys['В']) ax += 1;
      move(P1, p1, ax, ay, dt);

      let ax2 = 0, ay2 = 0;
      if (keys['ArrowUp']) ay2 -= 1;
      if (keys['ArrowDown']) ay2 += 1;
      if (keys['ArrowLeft']) ax2 -= 1;
      if (keys['ArrowRight']) ax2 += 1;
      move(P2, p2, ax2, ay2, dt);

      physics(dt);
    } else if (mode === 'online') {
      if (myRole === 'host') {
        let ax = 0, ay = 0;
        if (keys['w'] || keys['ц'] || keys['W'] || keys['Ц']) ay -= 1;
        if (keys['s'] || keys['ы'] || keys['S'] || keys['Ы']) ay += 1;
        if (keys['a'] || keys['ф'] || keys['A'] || keys['Ф']) ax -= 1;
        if (keys['d'] || keys['в'] || keys['D'] || keys['В']) ax += 1;
        move(P1, p1, ax, ay, dt);
        physics(dt);
        sendState();
      } else {
        let ax2 = 0, ay2 = 0;
        if (keys['ArrowUp']) ay2 -= 1;
        if (keys['ArrowDown']) ay2 += 1;
        if (keys['ArrowLeft']) ax2 -= 1;
        if (keys['ArrowRight']) ax2 += 1;
        move(P2, p2, ax2, ay2, dt);
        physics(dt);
        sendState();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  function physics(dt) {
    if (mode === 'online' && myRole !== 'host') return;

    B.x += B.vx * dt;
    B.y += B.vy * dt;
    B.vx *= Math.pow(B.fr, dt);
    B.vy *= Math.pow(B.fr, dt);
    if (Math.abs(B.vx) < 0.05) B.vx = 0;
    if (Math.abs(B.vy) < 0.05) B.vy = 0;

    const r = B.size / 2;
    if (B.y - r < FT) { B.y = FT + r; B.vy = -B.vy * 0.7; }
    if (B.y + r > FB) { B.y = FB - r; B.vy = -B.vy * 0.7; }

    const goalHeight = (FB - FT) * 0.5;
    const gT = FB - goalHeight;
    const gB = FB;
    const goalDepth = 40;

    if (B.x - r < goalDepth && B.y > gT && B.y < gB) {
      if (!goalLock) goal('left');
      return;
    }
    if (B.x + r > W - goalDepth && B.y > gT && B.y < gB) {
      if (!goalLock) goal('right');
      return;
    }

    if (B.x - r < FL) { B.x = FL + r; B.vx = -B.vx * 0.7; }
    if (B.x + r > FR) { B.x = FR - r; B.vx = -B.vx * 0.7; }

    coll(P1);
    coll(P2);
  }

  function draw() {
    p1.style.left = (P1.x - 22) + 'px';
    p1.style.top  = (P1.y - 85) + 'px';
    p2.style.left = (P2.x - 22) + 'px';
    p2.style.top  = (P2.y - 85) + 'px';
    ballEl.style.left = (B.x - 13) + 'px';
    ballEl.style.top  = (B.y - 13) + 'px';
  }

  resize();
  reset();
  showMenu();
</script>
</body>
</html>
