<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚽ Футбол 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a2a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    background: #2d8a2d;
    overflow: hidden;
    border-radius: 15px;
  }

  #field {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, #2d8a2d 0 40px, #33993a 40px 80px);
  }

  .center-line {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 3px; background: white;
    transform: translateX(-50%); opacity: 0.9;
  }

  .center-circle {
    position: absolute;
    left: 50%; top: 50%;
    width: 90px; height: 90px;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.9;
  }

  .goal {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 14px; height: 120px;
    background: white; border-radius: 3px; opacity: 0.9;
  }
  #goal-left { left: 0; }
  #goal-right { right: 0; }

  .my-goal {
    box-shadow: 0 0 25px 6px #ffd93d;
    animation: pulseGoal 1.5s infinite;
  }
  @keyframes pulseGoal {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; box-shadow: 0 0 35px 10px #ffd93d; }
  }

  .player {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 24px;
    border: 3px solid white;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    z-index: 10;
  }
  #p1 { background: #1a5fb4; }
  #p2 { background: #b41a1a; }

  #ball {
    position: absolute;
    width: 26px; height: 26px;
    font-size: 22px;
    display: flex; justify-content: center; align-items: center;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.5));
    z-index: 9;
  }

  #score {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 20px; font-weight: bold;
    border: 2px solid white;
    z-index: 20;
    white-space: nowrap;
  }
  .blue { color: #4a9eff; }
  .red { color: #ff6b6b; }

  #msg {
    position: absolute;
    top: 40%; left: 0; right: 0;
    text-align: center;
    font-size: 38px; font-weight: bold;
    color: #ffd93d;
    text-shadow: 0 0 20px black, 0 0 40px #ffd93d;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 30;
    pointer-events: none;
    padding: 0 10px;
  }
  #msg.show { opacity: 1; }

  .btn {
    position: absolute;
    width: 60px; height: 60px;
    font-size: 28px;
    border: 3px solid white;
    border-radius: 15px;
    cursor: pointer;
    color: white; font-weight: bold;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
    z-index: 15;
    display: flex; justify-content: center; align-items: center;
    touch-action: none;
  }
  .btn:active, .btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  .btn-l { background: #1a5fb4; }
  .btn-r { background: #b41a1a; }

  #cam {
    position: absolute;
    top: 60px; left: 10px;
    width: 70px; height: 90px;
    border: 3px solid #ffd93d;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    z-index: 25;
    display: none;
  }
  #cam video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 20, 0, 0.95);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
    overflow-y: auto;
  }

  #overlay h1 {
    font-size: 26px;
    color: #ffd93d;
    margin-bottom: 18px;
    text-shadow: 0 0 15px rgba(255,217,61,0.8);
  }

  #overlay p {
    font-size: 15px;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  #overlay .mode-btn {
    margin: 6px 0;
    padding: 18px 25px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    color: white;
    border: 3px solid white;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    min-width: 260px;
    text-align: left;
  }
  #overlay .mode-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  #overlay .mode-btn small {
    display: block; font-size: 12px; opacity: 0.85;
    margin-top: 3px; font-weight: normal;
  }

  .mode-bot { background: linear-gradient(135deg, #a855f7, #7c3aed); }
  .mode-split { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .mode-online { background: linear-gradient(135deg, #4ade80, #22c55e); }

  #overlay input {
    width: 100%;
    max-width: 260px;
    padding: 14px;
    font-size: 22px;
    text-align: center;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.12);
    border: 3px solid #4a9eff;
    border-radius: 12px;
    color: white;
    outline: none;
    margin: 8px 0;
  }

  #overlay .action-btn {
    margin: 8px 0;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: white;
    border: 3px solid white;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    min-width: 240px;
  }
  #overlay .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

  #overlay .back-btn {
    background: linear-gradient(135deg, #94a3b8, #64748b);
    min-width: 200px;
    margin-top: 15px;
  }

  #overlay .code-box {
    background: #ffd93d;
    color: #1a3d1a;
    font-size: 34px;
    font-weight: bold;
    padding: 15px 25px;
    border-radius: 15px;
    margin: 15px 0;
    letter-spacing: 4px;
    font-family: monospace;
    box-shadow: 0 0 25px rgba(255,217,61,0.8);
    cursor: pointer;
    word-break: break-all;
  }

  #overlay .status {
    font-size: 15px;
    color: #4ade80;
    margin-top: 12px;
    min-height: 20px;
  }
  #overlay .error { color: #ff6b6b; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game">
  <div id="field"></div>
  <div class="center-line"></div>
  <div class="center-circle"></div>
  <div class="goal" id="goal-left"></div>
  <div class="goal" id="goal-right"></div>

  <div id="cam"><video id="camVideo" autoplay muted playsinline></video></div>

  <div id="score">🔵 <span class="blue" id="s1">0</span> : <span class="red" id="s2">0</span> 🔴</div>
  <div id="msg"></div>

  <div class="player" id="p1">😎</div>
  <div class="player" id="p2">😡</div>
  <div id="ball">⚽</div>

  <!-- Кнопки игрока 1 (слева) -->
  <button class="btn btn-l" id="bl-up"    style="left:10px; top:28%;" >⬆</button>
  <button class="btn btn-l" id="bl-left"  style="left:10px; top:41%;" >⬅</button>
  <button class="btn btn-l" id="bl-down"  style="left:10px; top:54%;" >⬇</button>
  <button class="btn btn-l" id="bl-right" style="left:80px; top:41%;" >➡</button>

  <!-- Кнопки игрока 2 (справа) -->
  <button class="btn btn-r" id="br-up"    style="right:10px; top:28%;">⬆</button>
  <button class="btn btn-r" id="br-left"  style="right:80px; top:41%;">⬅</button>
  <button class="btn btn-r" id="br-down"  style="right:10px; top:54%;">⬇</button>
  <button class="btn btn-r" id="br-right" style="right:10px; top:41%;">➡</button>

  <div id="overlay"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  const game = document.getElementById('game');
  const p1 = document.getElementById('p1');
  const p2 = document.getElementById('p2');
  const ballEl = document.getElementById('ball');
  const s1El = document.getElementById('s1');
  const s2El = document.getElementById('s2');
  const msgEl = document.getElementById('msg');
  const overlay = document.getElementById('overlay');
  const goalLeft = document.getElementById('goal-left');
  const goalRight = document.getElementById('goal-right');
  const camBox = document.getElementById('cam');
  const camVideo = document.getElementById('camVideo');

  // Кнопки по бокам — скрываем в меню
  const sideButtons = ['bl-up','bl-left','bl-down','bl-right','br-up','br-left','br-down','br-right']
    .map(id => document.getElementById(id));

  let W, H;
  let mode = null;      // 'bot' | 'split' | 'online'
  let myRole = null;    // 'host' | 'guest'
  let peer = null, conn = null, myPeerId = null;

  const P1 = { x: 0, y: 0, vx: 0, vy: 0, speed: 3.2, size: 44 };
  const P2 = { x: 0, y: 0, vx: 0, vy: 0, speed: 3.2, size: 44 };
  const B  = { x: 0, y: 0, vx: 0, vy: 0, size: 26, fr: 0.985 };

  let s1 = 0, s2 = 0;
  let keys = {};
  let running = false;
  let lastT = 0;
  const WIN_SCORE = 3;
  let botTargetX = 0, botTargetY = 0, botThink = 0;

  function resize() {
    W = game.clientWidth;
    H = game.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    keys[e.key.toLowerCase()] = true;
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.key.toLowerCase()] = false;
  });

  function bindBtn(id, key) {
    const btn = document.getElementById(id);
    const press = e => { e.preventDefault(); keys[key] = true; btn.classList.add('pressed'); };
    const rel = e => { e.preventDefault(); keys[key] = false; btn.classList.remove('pressed'); };
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', rel);
    btn.addEventListener('mouseleave', rel);
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', rel);
    btn.addEventListener('touchcancel', rel);
  }

  bindBtn('bl-up', 'w');
  bindBtn('bl-left', 'a');
  bindBtn('bl-down', 's');
  bindBtn('bl-right', 'd');

  bindBtn('br-up', 'ArrowUp');
  bindBtn('br-left', 'ArrowLeft');
  bindBtn('br-down', 'ArrowDown');
  bindBtn('br-right', 'ArrowRight');

  // ===== МЕНЮ =====
  function showMenu() {
    mode = null;
    running = false;
    hideSideButtons();
    goalLeft.classList.remove('my-goal');
    goalRight.classList.remove('my-goal');
    camBox.style.display = 'none';

    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>⚽ ФУТБОЛ 2D</h1>
      <p>Выбери режим игры:</p>
      <button class="mode-btn mode-bot" onclick="startBotMode()">
        🤖 С БОТОМ
        <small>Играй против компьютера</small>
      </button>
      <button class="mode-btn mode-split" onclick="startSplitMode()">
        👥 ОДИН ЭКРАН
        <small>Двое на одном устройстве</small>
      </button>
      <button class="mode-btn mode-online" onclick="showOnlineMenu()">
        🌐 ПО КОДУ
        <small>Играть с другом по Wi-Fi</small>
      </button>
      <p style="font-size: 12px; opacity: 0.7; margin-top: 20px;">
        ⚽ Забей 3 гола и победи!
      </p>
    `;
  }

  function showOnlineMenu() {
    overlay.innerHTML = `
      <h1>🌐 Онлайн-игра</h1>
      <p>Один создаёт комнату, второй вводит код</p>
      <button class="action-btn" onclick="createRoom()">🏠 Создать комнату</button>
      <p style="margin: 12px 0; opacity: 0.7;">— или —</p>
      <input type="text" id="codeInput" placeholder="КОД" maxlength="6">
      <button class="action-btn" onclick="joinRoom()">🔗 Подключиться</button>
      <div class="status" id="status"></div>
      <button class="action-btn back-btn" onclick="showMenu()">← Назад</button>
    `;
  }

  function hideSideButtons() {
    sideButtons.forEach(b => b.classList.add('hidden'));
  }
  function showLeftButtons() {
    sideButtons.slice(0,4).forEach(b => b.classList.remove('hidden'));
  }
  function showBothButtons() {
    sideButtons.forEach(b => b.classList.remove('hidden'));
  }

  // ===== РЕЖИМ 1: БОТ =====
  function startBotMode() {
    mode = 'bot';
    myRole = 'host';
    s1 = 0; s2 = 0;
    s1El.textContent = 0; s2El.textContent = 0;
    overlay.classList.add('hidden');
    showLeftButtons();
    goalLeft.classList.add('my-goal');
    resize();
    reset();
    running = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  // ===== РЕЖИМ 2: ОДИН ЭКРАН =====
  function startSplitMode() {
    mode = 'split';
    myRole = 'host';
    s1 = 0; s2 = 0;
    s1El.textContent = 0; s2El.textContent = 0;
    overlay.classList.add('hidden');
    showBothButtons();
    resize();
    reset();
    running = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  // ===== РЕЖИМ 3: ОНЛАЙН =====
  function generateCode() {
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'FB';
    for (let i = 0; i < 4; i++) code += letters[Math.floor(Math.random() * letters.length)];
    return code;
  }

  function initPeer(customId = null) {
    const id = customId || ('fb-' + Math.random().toString(36).substring(2, 12));
    peer = new Peer(id, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });
    peer.on('open', id => { myPeerId = id; });
    peer.on('error', err => {
      const st = document.getElementById('status');
      if (!st) return;
      st.textContent = 'Ошибка: ' + err.type;
      st.className = 'status error';
    });
    peer.on('connection', connection => {
      conn = connection;
      setupConnection();
    });
    return peer;
  }

  function createRoom() {
    mode = 'online';
    myRole = 'host';
    s1 = 0; s2 = 0;
    const code = generateCode();
    const st = document.getElementById('status');
    st.textContent = 'Создаём комнату...';
    st.className = 'status';
    initPeer(code);
    const waitOpen = setInterval(() => {
      if (myPeerId) {
        clearInterval(waitOpen);
        overlay.innerHTML = `
          <h1>🏠 Комната создана!</h1>
          <p>Скажи другу этот код:</p>
          <div class="code-box" onclick="copyCode('${code}')">${code}</div>
          <p style="font-size: 12px; opacity: 0.7;">👆 нажми, чтобы скопировать</p>
          <p style="font-size: 13px; opacity: 0.8;">Ждём второго игрока...</p>
          <div class="status">⏳ Ожидание...</div>
          <button class="action-btn back-btn" onclick="location.reload()">← Отмена</button>
        `;
      }
    }, 100);
  }

  function joinRoom() {
    mode = 'online';
    myRole = 'guest';
    s1 = 0; s2 = 0;
    let code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length < 4) {
      const st = document.getElementById('status');
      st.textContent = 'Введи код';
      st.className = 'status error';
      return;
    }
    if (!code.startsWith('FB')) code = 'FB' + code;
    const st = document.getElementById('status');
    st.textContent = 'Подключаемся...';
    st.className = 'status';
    initPeer();
    const waitOpen = setInterval(() => {
      if (peer && peer.open) {
        clearInterval(waitOpen);
        conn = peer.connect(code, { reliable: true });
        setupConnection();
      }
    }, 100);
  }

  function setupConnection() {
    conn.on('open', () => startOnlineMatch());
    conn.on('data', data => handleData(data));
    conn.on('close', () => {
      running = false;
      msgEl.textContent = '⚠️ Соперник вышел';
      msgEl.classList.add('show');
      setTimeout(() => location.reload(), 2500);
    });
  }

  function copyCode(code) {
    navigator.clipboard?.writeText(code);
    const el = document.querySelector('.code-box');
    el.textContent = '✓ Скопировано!';
    setTimeout(() => { el.textContent = code; }, 1000);
  }

  async function startOnlineMatch() {
    overlay.classList.add('hidden');
    showLeftButtons();
    goalLeft.classList.remove('my-goal');
    goalRight.classList.remove('my-goal');
    if (myRole === 'host') goalLeft.classList.add('my-goal');
    else goalRight.classList.add('my-goal');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 320, height: 400 },
        audio: false
      });
      camVideo.srcObject = stream;
      camBox.style.display = 'block';
    } catch (e) { /* без камеры тоже ок */ }

    resize();
    reset();
    running = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  // ===== ИГРА =====
  function reset() {
    P1.x = W * 0.25; P1.y = H * 0.5;
    P2.x = W * 0.75; P2.y = H * 0.5;
    P1.vx = P1.vy = 0;
    P2.vx = P2.vy = 0;
    B.x = W / 2; B.y = H / 2;
    B.vx = B.vy = 0;
  }

  function move(P, ax, ay, dt) {
    P.vx = ax * P.speed * dt;
    P.vy = ay * P.speed * dt;
    P.x += P.vx;
    P.y += P.vy;
    const r = P.size / 2;
    P.x = Math.max(r, Math.min(W - r, P.x));
    P.y = Math.max(r + 30, Math.min(H - r - 30, P.y));
  }

  function coll(P) {
    const dx = B.x - P.x, dy = B.y - P.y;
    const d = Math.hypot(dx, dy);
    const md = (B.size + P.size) / 2 + 2;
    if (d < md && d > 0) {
      const nx = dx / d, ny = dy / d;
      B.x = P.x + nx * md;
      B.y = P.y + ny * md;
      B.vx = nx * 7 + P.vx * 0.5;
      B.vy = ny * 7 + P.vy * 0.5;
    }
  }

  function goal(side) {
    if (side === 'left') { s2++; s2El.textContent = s2; show('🔴 КРАСНЫЕ!'); }
    else { s1++; s1El.textContent = s1; show('🔵 СИНИЕ!'); }
    if (mode === 'online') {
      sendData({ type: 'goal', side, s1, s2 });
    }
  }

  function show(t) {
    msgEl.textContent = t;
    msgEl.classList.add('show');
    B.vx = 0; B.vy = 0;
    setTimeout(() => {
      msgEl.classList.remove('show');
      if (s1 >= WIN_SCORE || s2 >= WIN_SCORE) {
        msgEl.textContent = s1 >= WIN_SCORE ? '🔵 СИНИЕ ПОБЕДИЛИ!' : '🔴 КРАСНЫЕ ПОБЕДИЛИ!';
        msgEl.classList.add('show');
        setTimeout(() => location.reload(), 3000);
      } else {
        reset();
        if (mode === 'online' && myRole === 'host') {
          sendData({ type: 'reset', s1, s2 });
        }
      }
    }, 1500);
  }

  function sendData(data) {
    if (conn && conn.open) conn.send(data);
  }

  function handleData(data) {
    if (data.type === 'state') {
      if (myRole === 'host') {
        P2.x = data.p2x; P2.y = data.p2y;
      } else {
        P1.x = data.p1x; P1.y = data.p1y;
      }
      B.x = data.bx; B.y = data.by;
      B.vx = data.bvx; B.vy = data.bvy;
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
    } else if (data.type === 'goal') {
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
      if (data.side === 'left') show('🔴 КРАСНЫЕ!');
      else show('🔵 СИНИЕ!');
    } else if (data.type === 'reset') {
      B.x = W / 2; B.y = H / 2; B.vx = 0; B.vy = 0;
      s1 = data.s1; s2 = data.s2;
      s1El.textContent = s1; s2El.textContent = s2;
    }
  }

  function updateBot(dt) {
    botThink -= dt;
    if (botThink <= 0) {
      botThink = 5;
      botTargetX = Math.max(W * 0.4, Math.min(W - 30, B.x + 30));
      botTargetY = B.y;
      botTargetX += B.vx * 5;
      botTargetY += B.vy * 5;
    }
    let ax = 0, ay = 0;
    const dx = botTargetX - P2.x;
    const dy = botTargetY - P2.y;
    if (Math.abs(dx) > 5) ax = dx > 0 ? 1 : -1;
    if (Math.abs(dy) > 5) ay = dy > 0 ? 1 : -1;
    move(P2, ax, ay, dt);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastT) / 16.67) || 1;
    lastT = now;

    if (mode === 'bot') {
      updateP1ByKeys(dt);
      updateBot(dt);
      physics(dt);
      draw();
    } else if (mode === 'split') {
      updateP1ByKeys(dt);
      updateP2ByKeys(dt);
      physics(dt);
      draw();
    } else if (mode === 'online') {
      if (myRole === 'host') {
        updateP1ByKeys(dt);
        physics(dt);
        draw();
        sendState();
      } else {
        updateP2ByKeys(dt);
        physics(dt);
        draw();
        sendState();
      }
    }

    requestAnimationFrame(loop);
  }

  function updateP1ByKeys(dt) {
    let ax = 0, ay = 0;
    if (keys['w'] || keys['ц']) ay -= 1;
    if (keys['s'] || keys['ы']) ay += 1;
    if (keys['a'] || keys['ф']) ax -= 1;
    if (keys['d'] || keys['в']) ax += 1;
    move(P1, ax, ay, dt);
  }

  function updateP2ByKeys(dt) {
    let ax = 0, ay = 0;
    if (keys['ArrowUp']) ay -= 1;
    if (keys['ArrowDown']) ay += 1;
    if (keys['ArrowLeft']) ax -= 1;
    if (keys['ArrowRight']) ax += 1;
    move(P2, ax, ay, dt);
  }

  function physics(dt) {
    if (mode === 'online' && myRole !== 'host') return;

    B.x += B.vx * dt;
    B.y += B.vy * dt;
    B.vx *= Math.pow(B.fr, dt);
    B.vy *= Math.pow(B.fr, dt);
    if (Math.abs(B.vx) < 0.05) B.vx = 0;
    if (Math.abs(B.vy) < 0.05) B.vy = 0;

    const r = B.size / 2;
    if (B.y - r < 30) { B.y = 30 + r; B.vy = -B.vy * 0.7; }
    if (B.y + r > H - 30) { B.y = H - 30 - r; B.vy = -B.vy * 0.7; }

    const gT = H / 2 - 60, gB = H / 2 + 60;
    if (B.x - r < 14 && B.y > gT && B.y < gB) { goal('left'); return; }
    if (B.x + r > W - 14 && B.y > gT && B.y < gB) { goal('right'); return; }

    if (B.x - r < 0) { B.x = r; B.vx = -B.vx * 0.7; }
    if (B.x + r > W) { B.x = W - r; B.vx = -B.vx * 0.7; }

    coll(P1);
    coll(P2);
  }

  function sendState() {
    const data = {
      type: 'state',
      bx: B.x, by: B.y, bvx: B.vx, bvy: B.vy,
      s1, s2
    };
    if (myRole === 'host') { data.p1x = P1.x; data.p1y = P1.y; }
    else { data.p2x = P2.x; data.p2y = P2.y; }
    sendData(data);
  }

  function draw() {
    p1.style.left = (P1.x - 22) + 'px';
    p1.style.top = (P1.y - 22) + 'px';
    p2.style.left = (P2.x - 22) + 'px';
    p2.style.top = (P2.y - 22) + 'px';
    ballEl.style.left = (B.x - 13) + 'px';
    ballEl.style.top = (B.y - 13) + 'px';
  }

  // Старт
  resize();
  reset();
  hideSideButtons();
  showMenu();
</script>
</body>
