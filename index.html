<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Duel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
</head>
<body>
<div id="menu-screen">
    <h1>Football Duel</h1>
    <button id="pvp-btn">2 игрока (один экран)</button>
    <button id="bot-btn">Играть с ботом</button>
</div>

<div id="game-screen" style="display:none;">
    <canvas id="field"></canvas>
    <div id="scoreboard"><span id="score-left">0</span> : <span id="score-right">0</span></div>
    <button class="exit-btn" id="back-menu">В меню</button>
</div>

<script src="app.js"></script>
<!-- Регистрация Service Worker для офлайн-работы -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
    });
}
</script>
</body>
</html>
