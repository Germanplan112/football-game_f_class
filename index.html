<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Duel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- PWA -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
</head>
<body>
<div id="menu-screen">
    <h1>Football Duel</h1>
    <div class="button">2 игрока (один экран)</div>
    <div class="button">Играть с ботом</div>
</div>

<div id="game-screen">
    <canvas id="field"></canvas>
    <div id="scoreboard"><span id="score-left">0</span> : <span id="score-right">0</span></div>
    <div class="exit-btn">В меню</div>
    
    <!-- Скрытый элемент для загрузки картинки мяча -->
    <img src="goal-ball.png" alt="" id="goal-anim-ball">
</div>

<script src="app.js"></script>
<!-- Регистрация Service Worker для офлайн-работы -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
    });
}
</script>
</body>
</html>
